    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            overflow: hidden;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">

    <header class="bg-slate-800/95 backdrop-blur border-b border-slate-700 px-2 sm:px-4 py-2 flex items-center justify-between shadow-lg z-20 gap-1.5 sm:gap-2 shrink-0 select-none">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                </svg>
            </div>
            <div>
                <h1 class="text-[10px] sm:text-xs font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">Chromosome Builder</h1>
            </div>
        </div>
        
        <!-- Single-Row Unified Control Bar with Smooth Mobile Touch Scroll -->
        <div class="flex items-center space-x-1.5 sm:space-x-2 overflow-x-auto py-0.5 no-scrollbar touch-pan-x" style="-webkit-overflow-scrolling: touch; pointer-events: auto;">
            <!-- Add buttons -->
            <div class="flex items-center space-x-1 shrink-0 border-r border-slate-700 pr-1.5 sm:pr-2">
                <button onclick="app.addSegmentedChromosome()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] sm:text-[11px] font-medium px-2 sm:px-2.5 py-1 rounded-lg shadow transition flex items-center space-x-0.5 sm:space-x-1 shrink-0">
                    <span>+ เดี่ยว</span>
                </button>
                <button onclick="app.addXChromosome()" class="bg-pink-600 hover:bg-pink-500 text-white text-[10px] sm:text-[11px] font-medium px-2 sm:px-2.5 py-1 rounded-lg shadow transition flex items-center space-x-0.5 sm:space-x-1 shrink-0">
                    <span>+ X-Shape</span>
                </button>
                <button onclick="app.addCentrosome()" class="bg-amber-600 hover:bg-amber-500 text-white text-[10px] sm:text-[11px] font-medium px-2 sm:px-2.5 py-1 rounded-lg shadow transition flex items-center space-x-0.5 sm:space-x-1 shrink-0">
                    <span>+ เซนโทรฯ</span>
                </button>
                <button onclick="app.addNuclearMembrane()" class="bg-violet-600 hover:bg-violet-500 text-white text-[10px] sm:text-[11px] font-medium px-2 sm:px-2.5 py-1 rounded-lg shadow transition flex items-center space-x-0.5 sm:space-x-1 shrink-0">
                    <span>+ เยื่อหุ้ม</span>
                </button>
                <button onclick="app.toggleFiberMode()" id="btn-fiber-mode" class="bg-slate-700 hover:bg-slate-600 text-amber-300 text-[10px] sm:text-[11px] font-medium px-2 sm:px-2.5 py-1 rounded-lg shadow transition flex items-center space-x-0.5 sm:space-x-1 border border-amber-500/30 shrink-0">
                    <span>🔗 ลากเส้น</span>
                </button>
                <button onclick="app.clearAll()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-[10px] sm:text-[11px] font-medium px-1.5 sm:px-2 py-1 rounded-lg transition shrink-0">
                    ล้าง
                </button>
            </div>

            <!-- Selection Inspector Controls (Single row inline) -->
            <div id="no-selection" class="text-[10px] sm:text-[11px] text-slate-400 italic px-1 shrink-0 whitespace-nowrap">
                (คลิกวัตถุเพื่อควบคุม)
            </div>

            <div id="selection-controls" class="hidden flex items-center space-x-1.5 sm:space-x-2 text-[10px] sm:text-[11px] shrink-0">
                <!-- Color Picker 1 -->
                <div id="color1-container" class="flex items-center space-x-1 bg-slate-800/80 px-1.5 sm:px-2 py-0.5 rounded-lg border border-slate-700 shrink-0">
                    <span id="label-color1" class="text-slate-400">สี 1:</span>
                    <button onclick="app.setColor1('#6366f1')" class="w-3 h-3 rounded-full bg-indigo-500 ring-1 ring-white/30 hover:scale-125 transition"></button>
                    <button onclick="app.setColor1('#ec4899')" class="w-3 h-3 rounded-full bg-pink-500 ring-1 ring-white/30 hover:scale-125 transition"></button>
                    <button onclick="app.setColor1('#10b981')" class="w-3 h-3 rounded-full bg-emerald-500 ring-1 ring-white/30 hover:scale-125 transition"></button>
                    <button onclick="app.setColor1('#f59e0b')" class="w-3 h-3 rounded-full bg-amber-500 ring-1 ring-white/30 hover:scale-125 transition"></button>
                    <button onclick="app.setColor1('#06b6d4')" class="w-3 h-3 rounded-full bg-cyan-500 ring-1 ring-white/30 hover:scale-125 transition"></button>
                </div>

                <!-- Color Picker 2 -->
                <div id="color2-container" class="flex items-center space-x-1 bg-slate-800/80 px-1.5 sm:px-2 py-0.5 rounded-lg border border-slate-700 shrink-0">
                    <span id="label-color2" class="text-slate-400">สี 2:</span>
                    <button onclick="app.setColor2('#6366f1')" class="w-3 h-3 rounded-full bg-indigo-500 ring-1 ring-white/30 hover:scale-125 transition"></button>
                    <button onclick="app.setColor2('#ec4899')" class="w-3 h-3 rounded-full bg-pink-500 ring-1 ring-white/30 hover:scale-125 transition"></button>
                    <button onclick="app.setColor2('#10b981')" class="w-3 h-3 rounded-full bg-emerald-500 ring-1 ring-white/30 hover:scale-125 transition"></button>
                    <button onclick="app.setColor2('#f59e0b')" class="w-3 h-3 rounded-full bg-amber-500 ring-1 ring-white/30 hover:scale-125 transition"></button>
                    <button onclick="app.setColor2('#06b6d4')" class="w-3 h-3 rounded-full bg-cyan-500 ring-1 ring-white/30 hover:scale-125 transition"></button>
                </div>

                <!-- Length slider (สั้น-ยาว) -->
                <div id="length-container" class="flex items-center space-x-1 bg-slate-800/80 px-1.5 sm:px-2 py-0.5 rounded-lg border border-slate-700 shrink-0">
                    <span class="text-slate-400">ยาว:</span>
                    <input type="range" id="input-length" min="80" max="280" value="160" class="w-14 sm:w-16 accent-indigo-500 h-1" oninput="app.setLength(this.value)">
                </div>

                <!-- Segments slider -->
                <div id="segments-container" class="flex items-center space-x-1 bg-slate-800/80 px-1.5 sm:px-2 py-0.5 rounded-lg border border-slate-700 shrink-0">
                    <span class="text-slate-400">ข้อต่อ:</span>
                    <input type="range" id="input-segments" min="4" max="16" value="8" class="w-10 sm:w-12 accent-indigo-500 h-1" oninput="app.setSegments(this.value)">
                </div>

                <!-- Membrane Size slider -->
                <div id="membrane-size-container" class="hidden flex items-center space-x-1 bg-slate-800/80 px-1.5 sm:px-2 py-0.5 rounded-lg border border-slate-700 shrink-0">
                    <span class="text-slate-400">ขนาด:</span>
                    <input type="range" id="input-membrane-size" min="100" max="350" value="180" class="w-14 sm:w-16 accent-violet-500 h-1" oninput="app.setMembraneSize(this.value)">
                </div>

                <!-- Action buttons -->
                <div class="flex items-center space-x-1 shrink-0">
                    <button id="btn-duplicate" onclick="app.duplicateSelected()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-1.5 sm:px-2 py-0.5 rounded transition">สำเนา</button>
                    <button onclick="app.deleteSelected()" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 px-1.5 sm:px-2 py-0.5 rounded transition">ลบ</button>
                </div>
            </div>

            <!-- Nodes Toggle -->
            <div class="flex items-center space-x-1 bg-slate-800/80 px-1.5 sm:px-2 py-0.5 rounded-lg border border-slate-700 shrink-0">
                <span class="text-slate-400 text-[10px] sm:text-[11px]">ข้อต่อ</span>
                <input type="checkbox" id="toggle-nodes" checked onchange="app.toggleNodes(this.checked)" class="accent-indigo-500 w-3 h-3 rounded">
            </div>
        </div>

        <!-- Developer Credit Badge -->
        <div class="flex items-center space-x-1.5 sm:space-x-2 bg-slate-900/80 px-2 py-1 rounded-xl border border-slate-700/60 shadow-md shrink-0">
            <img src="https://github.com/metawat888/Picture/raw/69f9d3a46e017adc43abb8db3503ea8106ecae61/97488303_2887790847941184_353651305119481856_n.jpg" alt="นายเมธาวัฒน์ พงสะพัง" class="w-5 h-5 sm:w-6 sm:h-6 rounded-full object-cover ring-2 ring-indigo-500/50" onerror="this.src='https://placehold.co/40x40/6366f1/ffffff?text=M'">
            <div class="text-left hidden md:block">
                <p class="text-[8px] sm:text-[9px] text-slate-400 leading-tight">พัฒนาโดย</p>
                <p class="text-[10px] sm:text-[11px] font-medium text-slate-200 leading-tight">นายเมธาวัฒน์ พงสะพัง</p>
            </div>
        </div>
    </header>

    <main class="flex-1 relative bg-slate-950 overflow-hidden cursor-crosshair">
        <canvas id="simCanvas" class="w-full h-full block"></canvas>
        <div class="absolute bottom-3 left-3 right-3 sm:left-4 sm:right-auto bg-slate-900/80 backdrop-blur border border-slate-700/50 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl text-[11px] sm:text-xs text-slate-400 pointer-events-none flex items-center space-x-2 shadow-lg">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
            <span>💡 แตะและลากเพื่อเคลื่อนย้ายหรือดัดโครโมโซมบนมือถือ/แท็บเล็ตได้ทันที</span>
        </div>
    </main>

    <script>
        class Vector2D {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }
            add(v) { return new Vector2D(this.x + v.x, this.y + v.y); }
            sub(v) { return new Vector2D(this.x - v.x, this.y - v.y); }
            mult(n) { return new Vector2D(this.x * n, this.y * n); }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            dist(v) { return this.sub(v).mag(); }
            normalize() {
                let m = this.mag();
                if (m !== 0) { this.x /= m; this.y /= m; }
                return this;
            }
        }

        class Node {
            constructor(x, y) {
                this.pos = new Vector2D(x, y);
                this.pinned = false;
            }
        }

        class Stick {
            constructor(p1, p2, length) {
                this.p1 = p1;
                this.p2 = p2;
                this.length = length;
            }
            update() {
                let diff = this.p2.pos.sub(this.p1.pos);
                let currentDist = diff.mag();
                if (currentDist === 0) return;
                let correction = diff.mult((currentDist - this.length) / currentDist);
                let offset = correction.mult(0.5);

                if (!this.p1.pinned) this.p1.pos = this.p1.pos.add(offset);
                if (!this.p2.pinned) this.p2.pos = this.p2.pos.sub(offset);
            }
        }

        class Centrosome {
            constructor(x, y) {
                this.pos = new Vector2D(x, y);
                this.radius = 16;
            }

            draw(ctx, isSelected) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#f59e0b';
                ctx.shadowColor = 'rgba(245, 158, 11, 0.6)';
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.lineWidth = isSelected ? 3 : 2;
                ctx.strokeStyle = isSelected ? '#ffffff' : '#b45309';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.restore();
            }

            contains(x, y) {
                return this.pos.dist(new Vector2D(x, y)) < this.radius + 10;
            }

            translate(dx, dy) {
                this.pos.x += dx;
                this.pos.y += dy;
            }
        }

        class NuclearMembrane {
            constructor(x, y, radius = 180) {
                this.pos = new Vector2D(x, y);
                this.radius = radius;
            }

            draw(ctx, isSelected) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(139, 92, 246, 0.05)';
                ctx.fill();
                
                ctx.lineWidth = isSelected ? 3 : 2;
                ctx.strokeStyle = isSelected ? '#ffffff' : 'rgba(139, 92, 246, 0.6)';
                ctx.setLineDash([8, 6]);
                ctx.stroke();
                ctx.restore();
            }

            contains(x, y) {
                return this.pos.dist(new Vector2D(x, y)) < this.radius + 15;
            }

            translate(dx, dy) {
                this.pos.x += dx;
                this.pos.y += dy;
            }
        }

        class Chromosome {
            constructor(x, y, segments = 8, length = 160, color1 = '#6366f1', color2 = '#ec4899', thickness = 16) {
                this.color1 = color1;
                this.color2 = color2;
                this.thickness = thickness;
                this.segmentsCount = segments;
                this.nodes = [];
                this.sticks = [];
                this.isXShape = false;

                let segLen = length / segments;
                for (let i = 0; i <= segments; i++) {
                    let node = new Node(x, y + (i * segLen) - (length / 2));
                    this.nodes.push(node);
                }

                for (let i = 0; i < this.nodes.length - 1; i++) {
                    this.sticks.push(new Stick(this.nodes[i], this.nodes[i+1], segLen));
                }
            }

            static createXShape(x, y, color1 = '#6366f1', color2 = '#ec4899', thickness = 16) {
                let chrom = new Chromosome(x, y, 6, 140, color1, color1, thickness);
                chrom.isXShape = true;
                chrom.color2 = color2; 
                
                chrom.nodes2 = [];
                chrom.sticks2 = [];
                let segLen = 140 / 6;
                let angle = Math.PI / 5;

                for (let i = 0; i <= 6; i++) {
                    let relY = (i * segLen) - 70;
                    let nx = x + relY * Math.sin(angle);
                    let ny = y + relY * Math.cos(angle);
                    chrom.nodes2.push(new Node(nx, ny));
                }

                for (let i = 0; i < chrom.nodes2.length - 1; i++) {
                    chrom.sticks2.push(new Stick(chrom.nodes2[i], chrom.nodes2[i+1], segLen));
                }
                return chrom;
            }

            getTotalLength() {
                let top = this.nodes[0].pos;
                let bot = this.nodes[this.nodes.length - 1].pos;
                return top.dist(bot);
            }

            setLength(targetLength) {
                let currentTop = this.nodes[0].pos;
                let currentBot = this.nodes[this.nodes.length - 1].pos;
                let midX = (currentTop.x + currentBot.x) / 2;
                let midY = (currentTop.y + currentBot.y) / 2;
                
                let dir = currentBot.sub(currentTop);
                let currentLen = dir.mag();
                if (currentLen === 0) {
                    dir = new Vector2D(0, 1);
                } else {
                    dir = dir.normalize();
                }

                let segs = this.nodes.length - 1;
                let newSegLen = targetLength / segs;

                for (let i = 0; i < this.nodes.length; i++) {
                    let offsetFromCenter = (i * newSegLen) - (targetLength / 2);
                    this.nodes[i].pos = new Vector2D(
                        midX + dir.x * offsetFromCenter,
                        midY + dir.y * offsetFromCenter
                    );
                }
                for (let s of this.sticks) {
                    s.length = newSegLen;
                }

                if (this.isXShape && this.nodes2) {
                    let currentTop2 = this.nodes2[0].pos;
                    let currentBot2 = this.nodes2[this.nodes2.length - 1].pos;
                    let midX2 = (currentTop2.x + currentBot2.x) / 2;
                    let midY2 = (currentTop2.y + currentBot2.y) / 2;
                    let dir2 = currentBot2.sub(currentTop2);
                    let currentLen2 = dir2.mag();
                    if (currentLen2 === 0) {
                        dir2 = new Vector2D(0.5, 0.866);
                    } else {
                        dir2 = dir2.normalize();
                    }

                    for (let i = 0; i < this.nodes2.length; i++) {
                        let offsetFromCenter2 = (i * newSegLen) - (targetLength / 2);
                        this.nodes2[i].pos = new Vector2D(
                            midX2 + dir2.x * offsetFromCenter2,
                            midY2 + dir2.y * offsetFromCenter2
                        );
                    }
                    for (let s of this.sticks2) {
                        s.length = newSegLen;
                    }
                }
            }

            getCentromerePos() {
                let mid = Math.floor(this.nodes.length / 2);
                return this.nodes[mid].pos;
            }

            updatePhysics() {
                for (let s of this.sticks) {
                    s.update();
                }
                if (this.isXShape && this.sticks2) {
                    for (let s of this.sticks2) {
                        s.update();
                    }
                    let mid1 = Math.floor(this.nodes.length / 2);
                    let mid2 = Math.floor(this.nodes2.length / 2);
                    let c1 = this.nodes[mid1];
                    let c2 = this.nodes2[mid2];
                    if (!c1.pinned && !c2.pinned) {
                        let centerPos = c1.pos.add(c2.pos).mult(0.5);
                        c1.pos = centerPos;
                        c2.pos = centerPos;
                    } else if (c1.pinned && !c2.pinned) {
                        c2.pos = c1.pos;
                    } else if (!c1.pinned && c2.pinned) {
                        c1.pos = c2.pos;
                    }
                }
            }

            draw(ctx, showNodes, isSelected) {
                if (this.isXShape) {
                    this.drawSingleStrand(ctx, this.nodes, this.color1, this.thickness, isSelected);
                    if (this.nodes2) {
                        this.drawSingleStrand(ctx, this.nodes2, this.color2, this.thickness, isSelected);
                    }
                } else {
                    this.drawSplitStrand(ctx, this.nodes, this.color1, this.color2, this.thickness, isSelected);
                }

                if (showNodes) {
                    this.drawNodesList(ctx, this.nodes);
                    if (this.isXShape && this.nodes2) {
                        this.drawNodesList(ctx, this.nodes2);
                    }
                }

                if (this.isXShape && this.nodes && this.nodes2) {
                    let centromerePos = this.getCentromerePos();
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(centromerePos.x, centromerePos.y, this.thickness * 0.75, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = this.color1;
                    ctx.stroke();
                    ctx.restore();
                }
            }

            drawSingleStrand(ctx, nodesList, col, thick, isSelected) {
                if (nodesList.length < 2) return;

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(nodesList[0].pos.x, nodesList[0].pos.y);
                
                for (let i = 0; i < nodesList.length - 1; i++) {
                    let xc = (nodesList[i].pos.x + nodesList[i+1].pos.x) / 2;
                    let yc = (nodesList[i].pos.y + nodesList[i+1].pos.y) / 2;
                    ctx.quadraticCurveTo(nodesList[i].pos.x, nodesList[i].pos.y, xc, yc);
                }
                let last = nodesList[nodesList.length - 1];
                ctx.lineTo(last.pos.x, last.pos.y);

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                if (isSelected) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = thick + 6;
                    ctx.stroke();
                }

                ctx.strokeStyle = col;
                ctx.lineWidth = thick;
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = Math.max(2, thick * 0.2);
                ctx.stroke();

                this.drawCap(ctx, nodesList[0].pos, thick, col);
                this.drawCap(ctx, nodesList[nodesList.length - 1].pos, thick, col);
                ctx.restore();
            }

            drawSplitStrand(ctx, nodesList, colTop, colBot, thick, isSelected) {
                if (nodesList.length < 2) return;
                let midIdx = Math.floor(nodesList.length / 2);

                // Draw Top Half (Color 1)
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(nodesList[0].pos.x, nodesList[0].pos.y);
                for (let i = 0; i < midIdx; i++) {
                    let xc = (nodesList[i].pos.x + nodesList[i+1].pos.x) / 2;
                    let yc = (nodesList[i].pos.y + nodesList[i+1].pos.y) / 2;
                    ctx.quadraticCurveTo(nodesList[i].pos.x, nodesList[i].pos.y, xc, yc);
                }
                let midNode = nodesList[midIdx];
                ctx.lineTo(midNode.pos.x, midNode.pos.y);

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                if (isSelected) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = thick + 6;
                    ctx.stroke();
                }

                ctx.strokeStyle = colTop;
                ctx.lineWidth = thick;
                ctx.stroke();
                
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = Math.max(2, thick * 0.2);
                ctx.stroke();
                this.drawCap(ctx, nodesList[0].pos, thick, colTop);
                ctx.restore();

                // Draw Bottom Half (Color 2)
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(midNode.pos.x, midNode.pos.y);
                for (let i = midIdx; i < nodesList.length - 1; i++) {
                    let xc = (nodesList[i].pos.x + nodesList[i+1].pos.x) / 2;
                    let yc = (nodesList[i].pos.y + nodesList[i+1].pos.y) / 2;
                    ctx.quadraticCurveTo(nodesList[i].pos.x, nodesList[i].pos.y, xc, yc);
                }
                let last = nodesList[nodesList.length - 1];
                ctx.lineTo(last.pos.x, last.pos.y);

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (isSelected) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = thick + 6;
                    ctx.stroke();
                }

                ctx.strokeStyle = colBot;
                ctx.lineWidth = thick;
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = Math.max(2, thick * 0.2);
                ctx.stroke();
                this.drawCap(ctx, last.pos, thick, colBot);
                ctx.restore();
            }

            drawCap(ctx, pos, thick, col) {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, thick / 2, 0, Math.PI * 2);
                ctx.fillStyle = col;
                ctx.fill();
            }

            drawNodesList(ctx, nodesList) {
                for (let i = 0; i < nodesList.length; i++) {
                    let node = nodesList[i];
                    ctx.beginPath();
                    let isMid = (i === Math.floor(nodesList.length / 2));
                    let radius = isMid ? 7 : 5;
                    ctx.arc(node.pos.x, node.pos.y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = 2;
                    ctx.fill();
                    ctx.stroke();
                }
            }

            contains(x, y) {
                let hitDist = this.thickness + 16;
                for (let node of this.nodes) {
                    if (node.pos.dist(new Vector2D(x, y)) < hitDist) return true;
                }
                if (this.nodes2) {
                    for (let node of this.nodes2) {
                        if (node.pos.dist(new Vector2D(x, y)) < hitDist) return true;
                    }
                }
                return false;
            }

            translate(dx, dy) {
                for (let node of this.nodes) {
                    node.pos.x += dx;
                    node.pos.y += dy;
                }
                if (this.nodes2) {
                    for (let node of this.nodes2) {
                        node.pos.x += dx;
                        node.pos.y += dy;
                    }
                }
            }
        }

        class ChromosomeApp {
            constructor() {
                this.canvas = document.getElementById('simCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.chromosomes = [];
                this.centrosomes = [];
                this.nuclearMembranes = [];
                this.spindleFibers = [];
                
                this.selectedChromosome = null;
                this.selectedCentrosome = null;
                this.selectedMembrane = null;
                this.activeNode = null;
                this.showNodes = true;
                this.fiberModeActive = false;
                
                this.dragMode = null;
                this.lastMousePos = new Vector2D(0, 0);

                this.initCanvasSize();
                this.initListeners();
                this.animate();
            }

            initCanvasSize() {
                const dpr = window.devicePixelRatio || 1;
                const rect = this.canvas.getBoundingClientRect();
                this.logicalWidth = rect.width || window.innerWidth;
                this.logicalHeight = rect.height || (window.innerHeight - 60);
                this.canvas.width = this.logicalWidth * dpr;
                this.canvas.height = this.logicalHeight * dpr;
                this.ctx.scale(dpr, dpr);
            }

            addSegmentedChromosome() {
                let x = (this.logicalWidth || window.innerWidth) / 2 + (Math.random() * 60 - 30);
                let y = (this.logicalHeight || window.innerHeight) / 2 + (Math.random() * 60 - 30);
                let chrom = new Chromosome(x, y, 8, 160, '#6366f1', '#ec4899', 16);
                this.chromosomes.push(chrom);
                this.selectChromosome(chrom);
            }

            addXChromosome() {
                let x = (this.logicalWidth || window.innerWidth) / 2 + (Math.random() * 60 - 30);
                let y = (this.logicalHeight || window.innerHeight) / 2 + (Math.random() * 60 - 30);
                let chrom = Chromosome.createXShape(x, y, '#6366f1', '#ec4899', 16);
                this.chromosomes.push(chrom);
                this.selectChromosome(chrom);
            }

            addCentrosome() {
                let x = (this.logicalWidth || window.innerWidth) / 2 + (Math.random() * 100 - 50);
                let y = 100 + Math.random() * 50;
                let cs = new Centrosome(x, y);
                this.centrosomes.push(cs);
                this.selectedCentrosome = cs;
                this.selectedChromosome = null;
                this.selectedMembrane = null;
                this.updateInspector();
            }

            addNuclearMembrane() {
                let x = (this.logicalWidth || window.innerWidth) / 2;
                let y = (this.logicalHeight || window.innerHeight) / 2;
                let nm = new NuclearMembrane(x, y, 180);
                this.nuclearMembranes.push(nm);
                this.selectedMembrane = nm;
                this.selectedCentrosome = null;
                this.selectedChromosome = null;
                this.updateInspector();
            }

            clearAll() {
                this.chromosomes = [];
                this.centrosomes = [];
                this.nuclearMembranes = [];
                this.spindleFibers = [];
                this.selectChromosome(null);
                this.selectedCentrosome = null;
                this.selectedMembrane = null;
                if (this.fiberModeActive) this.toggleFiberMode();
                this.updateInspector();
            }

            toggleFiberMode() {
                if (!this.selectedCentrosome) {
                    const notif = document.createElement('div');
                    notif.className = 'absolute top-16 left-1/2 -translate-x-1/2 bg-amber-600 text-white text-xs px-4 py-2 rounded-xl shadow-xl z-50 transition animate-bounce';
                    notif.innerText = '⚠️ กรุณาคลิกเลือกเซนโทรโซมก่อนเปิดโหมดลากเส้นเชื่อม';
                    document.body.appendChild(notif);
                    setTimeout(() => notif.remove(), 2500);
                    return;
                }
                this.fiberModeActive = !this.fiberModeActive;
                const btn = document.getElementById('btn-fiber-mode');
                if (this.fiberModeActive) {
                    btn.classList.add('bg-amber-600', 'text-white', 'shadow-amber-500/30');
                    btn.classList.remove('bg-slate-700', 'text-amber-300');
                } else {
                    btn.classList.remove('bg-amber-600', 'text-white', 'shadow-amber-500/30');
                    btn.classList.add('bg-slate-700', 'text-amber-300');
                }
            }

            initListeners() {
                const getPos = (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : (e.changedTouches && e.changedTouches.length > 0 ? e.changedTouches[0].clientX : e.clientX);
                    const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : (e.changedTouches && e.changedTouches.length > 0 ? e.changedTouches[0].clientY : e.clientY);
                    return new Vector2D(clientX - rect.left, clientY - rect.top);
                };

                const onDown = (e) => {
                    let pos = getPos(e);
                    this.lastMousePos = pos;

                    if (this.fiberModeActive && this.selectedCentrosome) {
                        let closestNode = null;
                        let minD = 60;
                        for (let chrom of this.chromosomes) {
                            let allNodes = [...chrom.nodes];
                            if (chrom.nodes2) allNodes.push(...chrom.nodes2);
                            for (let node of allNodes) {
                                let d = node.pos.dist(pos);
                                if (d < minD) {
                                    minD = d;
                                    closestNode = node;
                                }
                            }
                        }
                        if (closestNode) {
                            let exists = this.spindleFibers.some(f => f.centrosome === this.selectedCentrosome && f.targetNode === closestNode);
                            if (!exists) {
                                this.spindleFibers.push({ centrosome: this.selectedCentrosome, targetNode: closestNode });
                            }
                            this.toggleFiberMode();
                            return;
                        }
                    }

                    for (let cs of this.centrosomes) {
                        if (cs.contains(pos.x, pos.y)) {
                            this.selectedCentrosome = cs;
                            this.selectedChromosome = null;
                            this.selectedMembrane = null;
                            this.dragMode = 'translate_centrosome';
                            this.updateInspector();
                            return;
                        }
                    }

                    for (let nm of this.nuclearMembranes) {
                        if (nm.contains(pos.x, pos.y)) {
                            this.selectedMembrane = nm;
                            this.selectedCentrosome = null;
                            this.selectedChromosome = null;
                            this.dragMode = 'translate_membrane';
                            this.updateInspector();
                            return;
                        }
                    }

                    if (this.selectedChromosome) {
                        let allNodes = [...this.selectedChromosome.nodes];
                        if (this.selectedChromosome.nodes2) allNodes.push(...this.selectedChromosome.nodes2);
                        
                        for (let node of allNodes) {
                            if (node.pos.dist(pos) < 26) {
                                this.activeNode = node;
                                this.activeNode.pinned = true;
                                this.dragMode = 'node';
                                return;
                            }
                        }
                    }

                    let clicked = null;
                    for (let i = this.chromosomes.length - 1; i >= 0; i--) {
                        if (this.chromosomes[i].contains(pos.x, pos.y)) {
                            clicked = this.chromosomes[i];
                            break;
                        }
                    }

                    if (clicked) {
                        this.selectChromosome(clicked);
                        this.dragMode = 'translate_chrom';
                    } else {
                        this.selectChromosome(null);
                        this.selectedCentrosome = null;
                        this.selectedMembrane = null;
                        this.dragMode = null;
                        this.updateInspector();
                        if (this.fiberModeActive) {
                            this.toggleFiberMode();
                        }
                    }
                };

                const onMove = (e) => {
                    let pos = getPos(e);
                    let delta = pos.sub(this.lastMousePos);
                    this.lastMousePos = pos;

                    if (this.dragMode === 'node' && this.activeNode) {
                        this.activeNode.pos = pos;
                    } else if (this.dragMode === 'translate_chrom' && this.selectedChromosome) {
                        this.selectedChromosome.translate(delta.x, delta.y);
                    } else if (this.dragMode === 'translate_centrosome' && this.selectedCentrosome) {
                        this.selectedCentrosome.translate(delta.x, delta.y);
                    } else if (this.dragMode === 'translate_membrane' && this.selectedMembrane) {
                        this.selectedMembrane.translate(delta.x, delta.y);
                    }
                };

                const onUp = (e) => {
                    if (this.activeNode) {
                        this.activeNode.pinned = false;
                        this.activeNode = null;
                    }
                    if (!this.fiberModeActive) {
                        this.dragMode = null;
                    }
                };

                this.canvas.addEventListener('mousedown', onDown);
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);

                this.canvas.addEventListener('touchstart', (e) => { onDown(e); e.preventDefault(); }, {passive: false});
                this.canvas.addEventListener('touchmove', (e) => { onMove(e); e.preventDefault(); }, {passive: false});
                this.canvas.addEventListener('touchend', (e) => { onUp(e); e.preventDefault(); }, {passive: false});
            }

            selectChromosome(chrom) {
                this.selectedChromosome = chrom;
                if (chrom) {
                    this.selectedCentrosome = null;
                    this.selectedMembrane = null;
                }
                this.updateInspector();
            }

            updateInspector() {
                const noSel = document.getElementById('no-selection');
                const selControls = document.getElementById('selection-controls');
                const lengthContainer = document.getElementById('length-container');
                const segContainer = document.getElementById('segments-container');
                const color1Container = document.getElementById('color1-container');
                const color2Container = document.getElementById('color2-container');
                const membraneSizeContainer = document.getElementById('membrane-size-container');
                const labelColor1 = document.getElementById('label-color1');
                const labelColor2 = document.getElementById('label-color2');
                const btnDup = document.getElementById('btn-duplicate');

                if (!this.selectedChromosome && !this.selectedCentrosome && !this.selectedMembrane) {
                    if (noSel) noSel.classList.remove('hidden');
                    if (selControls) selControls.classList.add('hidden');
                } else if (this.selectedChromosome) {
                    if (noSel) noSel.classList.add('hidden');
                    if (selControls) selControls.style.display = 'flex';
                    if (color1Container) color1Container.style.display = 'flex';
                    if (lengthContainer) lengthContainer.style.display = 'flex';
                    if (segContainer) segContainer.style.display = 'flex';
                    if (btnDup) btnDup.style.display = 'inline-block';
                    if (color2Container) color2Container.style.display = 'flex';
                    if (membraneSizeContainer) membraneSizeContainer.style.display = 'none';

                    if (this.selectedChromosome.isXShape) {
                        if (labelColor1) labelColor1.innerText = 'สี 1:';
                        if (labelColor2) labelColor2.innerText = 'สี 2:';
                    } else {
                        if (labelColor1) labelColor1.innerText = 'สีบน:';
                        if (labelColor2) labelColor2.innerText = 'สีล่าง:';
                    }

                    const inputLen = document.getElementById('input-length');
                    if (inputLen) inputLen.value = Math.round(this.selectedChromosome.getTotalLength());

                    const inputSeg = document.getElementById('input-segments');
                    if (inputSeg) inputSeg.value = this.selectedChromosome.nodes.length - 1;
                } else if (this.selectedCentrosome) {
                    if (noSel) noSel.classList.add('hidden');
                    if (selControls) selControls.style.display = 'flex';
                    if (color1Container) color1Container.style.display = 'none';
                    if (lengthContainer) lengthContainer.style.display = 'none';
                    if (segContainer) segContainer.style.display = 'none';
                    if (color2Container) color2Container.style.display = 'none';
                    if (membraneSizeContainer) membraneSizeContainer.style.display = 'none';
                    if (btnDup) btnDup.style.display = 'none';
                } else if (this.selectedMembrane) {
                    if (noSel) noSel.classList.add('hidden');
                    if (selControls) selControls.style.display = 'flex';
                    if (color1Container) color1Container.style.display = 'none';
                    if (lengthContainer) lengthContainer.style.display = 'none';
                    if (segContainer) segContainer.style.display = 'none';
                    if (color2Container) color2Container.style.display = 'none';
                    if (membraneSizeContainer) membraneSizeContainer.style.display = 'flex';
                    if (btnDup) btnDup.style.display = 'none';

                    const inputMem = document.getElementById('input-membrane-size');
                    if (inputMem) inputMem.value = this.selectedMembrane.radius;
                }
            }

            setColor1(hex) {
                if (this.selectedChromosome) {
                    this.selectedChromosome.color1 = hex;
                }
            }

            setColor2(hex) {
                if (this.selectedChromosome) {
                    this.selectedChromosome.color2 = hex;
                }
            }

            setMembraneSize(val) {
                let r = parseInt(val);
                if (this.selectedMembrane) {
                    this.selectedMembrane.radius = r;
                }
            }

            setLength(val) {
                let l = parseInt(val);
                if (this.selectedChromosome) {
                    this.selectedChromosome.setLength(l);
                }
            }

            setSegments(val) {
                let segs = parseInt(val);
                if (this.selectedChromosome && !this.selectedChromosome.isXShape) {
                    let c = this.selectedChromosome;
                    let currentLen = c.getTotalLength();
                    let topPos = c.nodes[0].pos;
                    let botPos = c.nodes[c.nodes.length - 1].pos;
                    let midX = (topPos.x + botPos.x) / 2;
                    let midY = (topPos.y + botPos.y) / 2;
                    
                    let newChrom = new Chromosome(midX, midY, segs, Math.max(80, currentLen), c.color1, c.color2, c.thickness);
                    let idx = this.chromosomes.indexOf(c);
                    if (idx !== -1) {
                        for (let f of this.spindleFibers) {
                            if (c.nodes.includes(f.targetNode)) {
                                f.targetNode = newChrom.nodes[Math.floor(newChrom.nodes.length / 2)];
                            }
                        }
                        this.chromosomes[idx] = newChrom;
                        this.selectedChromosome = newChrom;
                    }
                }
            }

            duplicateSelected() {
                if (this.selectedChromosome) {
                    let c = this.selectedChromosome;
                    let currentLen = c.getTotalLength();
                    let clone = new Chromosome(c.nodes[0].pos.x + 40, c.nodes[0].pos.y + 40, c.nodes.length - 1, currentLen, c.color1, c.color2, c.thickness);
                    clone.isXShape = c.isXShape;
                    if (c.isXShape) {
                        clone = Chromosome.createXShape(c.getCentromerePos().x + 40, c.getCentromerePos().y + 40, c.color1, c.color2, c.thickness);
                    }
                    this.chromosomes.push(clone);
                    this.selectChromosome(clone);
                }
            }

            deleteSelected() {
                if (this.selectedChromosome) {
                    this.chromosomes = this.chromosomes.filter(item => item !== this.selectedChromosome);
                    this.spindleFibers = this.spindleFibers.filter(f => !this.selectedChromosome.nodes.includes(f.targetNode) && (!this.selectedChromosome.nodes2 || !this.selectedChromosome.nodes2.includes(f.targetNode)));
                    this.selectChromosome(null);
                } else if (this.selectedCentrosome) {
                    this.centrosomes = this.centrosomes.filter(item => item !== this.selectedCentrosome);
                    this.spindleFibers = this.spindleFibers.filter(f => f.centrosome !== this.selectedCentrosome);
                    this.selectedCentrosome = null;
                    this.updateInspector();
                } else if (this.selectedMembrane) {
                    this.nuclearMembranes = this.nuclearMembranes.filter(item => item !== this.selectedMembrane);
                    this.selectedMembrane = null;
                    this.updateInspector();
                }
            }

            toggleNodes(checked) {
                this.showNodes = checked;
            }

            animate() {
                const updateLoop = () => {
                    for (let chrom of this.chromosomes) {
                        chrom.updatePhysics();
                    }

                    this.ctx.clearRect(0, 0, this.logicalWidth, this.logicalHeight);

                    // Draw nuclear membranes
                    for (let nm of this.nuclearMembranes) {
                        nm.draw(this.ctx, nm === this.selectedMembrane);
                    }

                    // Draw spindle fibers
                    for (let fiber of this.spindleFibers) {
                        this.ctx.save();
                        this.ctx.beginPath();
                        this.ctx.moveTo(fiber.centrosome.pos.x, fiber.centrosome.pos.y);
                        this.ctx.lineTo(fiber.targetNode.pos.x, fiber.targetNode.pos.y);
                        this.ctx.strokeStyle = 'rgba(245, 158, 11, 0.6)';
                        this.ctx.lineWidth = 2;
                        this.ctx.setLineDash([4, 4]);
                        this.ctx.stroke();
                        this.ctx.restore();
                    }

                    // Draw centrosomes
                    for (let cs of this.centrosomes) {
                        cs.draw(this.ctx, cs === this.selectedCentrosome);
                    }

                    // Draw chromosomes
                    for (let chrom of this.chromosomes) {
                        chrom.draw(this.ctx, this.showNodes, chrom === this.selectedChromosome);
                    }

                    requestAnimationFrame(updateLoop);
                };
                requestAnimationFrame(updateLoop);
            }
        }

        let app = null;
        window.onload = function() {
            app = new ChromosomeApp();
        };

        window.addEventListener('resize', () => {
            if (app) {
                const rect = app.canvas.getBoundingClientRect();
                app.logicalWidth = rect.width || window.innerWidth;
                app.logicalHeight = rect.height || (window.innerHeight - 60);
                const dpr = window.devicePixelRatio || 1;
                app.canvas.width = app.logicalWidth * dpr;
                app.canvas.height = app.logicalHeight * dpr;
                app.ctx.scale(dpr, dpr);
            }
        });
    </script>
